name: daily

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate list
        run: python3 generate.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- cn-eyeball.txt; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn-eyeball.txt
          git commit -m "chore: update cn-eyeball list $(date -u +%F)"
          git push
